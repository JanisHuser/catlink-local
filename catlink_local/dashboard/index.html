<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CATLINK Local</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e222b; --border: #2a2f3a;
    --text: #e6e9ef; --muted: #8b93a3; --accent: #38d39f; --accent2: #4aa3ff;
    --in: #4aa3ff; --out: #38d39f; --warn: #f2b04a;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f5f6f8; --panel: #ffffff; --panel2: #f0f2f5; --border: #dde1e8;
      --text: #1a1d23; --muted: #6b7280; --accent: #12a074; --accent2: #2563eb;
      --in: #2563eb; --out: #12a074; --warn: #b7791f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 16px 22px;
    border-bottom: 1px solid var(--border); background: var(--panel);
    position: sticky; top: 0; z-index: 5;
  }
  header .logo { font-size: 22px; }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  header .status { margin-left: auto; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.live { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  main { display: grid; grid-template-columns: minmax(320px, 1fr) minmax(340px, 1.1fr); gap: 18px; padding: 18px 22px; max-width: 1200px; margin: 0 auto; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 10px; }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px; margin-bottom: 14px;
  }
  .device .top { display: flex; align-items: baseline; gap: 10px; }
  .device .mac { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--panel2); color: var(--muted); border: 1px solid var(--border); }
  .badge.type { color: var(--accent); border-color: var(--accent); }
  .badge.type.unknown { color: var(--warn); border-color: var(--warn); }
  .note { margin: 10px 0 4px; padding: 10px 12px; border-radius: 8px; background: var(--panel2); border: 1px solid var(--border); color: var(--muted); font-size: 13px; }
  .note .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--text); margin-top: 4px; word-break: break-all; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin: 14px 0; }
  .stat { background: var(--panel2); border-radius: 8px; padding: 10px 12px; }
  .stat .k { font-size: 11px; color: var(--muted); }
  .stat .v { font-size: 18px; font-weight: 600; margin-top: 2px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 6px; }
  button {
    font: inherit; font-weight: 600; cursor: pointer; border: none; border-radius: 8px;
    padding: 8px 14px; background: var(--accent); color: #04140e;
  }
  button.secondary { background: var(--panel2); color: var(--text); border: 1px solid var(--border); }
  button:active { transform: translateY(1px); }
  input[type=number] { width: 64px; font: inherit; padding: 7px 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel2); color: var(--text); }
  .empty { color: var(--muted); padding: 24px; text-align: center; }
  .log { height: 68vh; overflow-y: auto; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .row { display: flex; gap: 8px; padding: 4px 6px; border-radius: 6px; white-space: nowrap; }
  .row:hover { background: var(--panel2); }
  .row .t { color: var(--muted); }
  .row .arrow.in { color: var(--in); }
  .row .arrow.out { color: var(--out); }
  .row .cmd { color: var(--text); }
  .row .body { color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--border); padding: 10px 16px; border-radius: 10px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <span class="logo">🐾</span>
  <h1>CATLINK Local</h1>
  <div class="status"><span id="dot" class="dot"></span><span id="conn">connecting…</span></div>
</header>
<main>
  <section>
    <h2>Devices</h2>
    <div id="devices"><div class="card empty">No devices connected yet. Point the device's DNS here and wait for it to check in.</div></div>
  </section>
  <section>
    <h2>Live traffic · unknown devices only</h2>
    <div class="card log" id="log"></div>
  </section>
</main>
<div id="toast" class="toast"></div>

<script>
const CMD_NAMES = { 0x0352: "status", 0x0452: "time", 0x0552: "feed", 0x0252: "feed-report" };
const devices = new Map();   // mac -> snapshot
const logEl = document.getElementById("log");
const devicesEl = document.getElementById("devices");
const dot = document.getElementById("dot");
const conn = document.getElementById("conn");

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2200);
}

function hex(n, w=2) { return n == null ? "—" : n.toString(16).padStart(w, "0"); }
function fmtTime(ts) { return new Date(ts * 1000).toLocaleTimeString(); }

function renderDevices() {
  if (devices.size === 0) {
    devicesEl.innerHTML = '<div class="card empty">No devices connected yet. Point the device\'s DNS here and wait for it to check in.</div>';
    return;
  }
  devicesEl.innerHTML = "";
  for (const d of devices.values()) devicesEl.appendChild(renderDevice(d));
}

function renderDevice(d) {
  const card = document.createElement("div");
  card.className = "card device";
  const state = d.state || {};
  const stats = [];
  if ("bowl_grams" in state) stats.push(["Food in bowl", (state.bowl_grams ?? "—") + " g"]);
  if ("active" in state) stats.push(["Feeding", state.active ? "yes" : "no"]);
  if ("last_feed_portions" in state) stats.push(["Last feed", (state.last_feed_portions ?? "—") + " p"]);
  stats.push(["Packets in", d.packets_in]);
  stats.push(["Packets out", d.packets_out]);

  const unknown = d.device_type === "unidentified";
  let extra = "";
  if (unknown) {
    const seen = (state.commands_seen && Object.keys(state.commands_seen)) || [];
    extra = `
      <div class="note">
        🔍 Unrecognised device — capturing traffic for reverse engineering.
        ${d.capture_path ? `<div class="mono">→ ${d.capture_path}</div>` : ""}
        ${seen.length ? `<div class="mono">sub/cmd seen: ${seen.join(", ")}</div>` : ""}
      </div>`;
  }

  card.innerHTML = `
    <div class="top">
      <span class="mac">${d.mac}</span>
      <span class="badge type ${unknown ? "unknown" : ""}">${d.device_type}</span>
      <span class="badge">${d.sub_type || "unknown"}</span>
    </div>
    <div class="grid">
      ${stats.map(([k, v]) => `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("")}
    </div>
    ${extra}
    <div class="controls" data-mac="${d.mac}"></div>`;

  const controls = card.querySelector(".controls");
  for (const c of d.commands || []) {
    if (c.name === "feed") {
      const inp = document.createElement("input");
      inp.type = "number"; inp.min = 1; inp.max = 12; inp.value = 1; inp.id = "portions-" + d.mac;
      controls.appendChild(inp);
    }
    const btn = document.createElement("button");
    btn.textContent = c.label;
    if (c.name !== "feed") btn.className = "secondary";
    btn.onclick = () => sendCommand(d.mac, c.name);
    controls.appendChild(btn);
  }
  return card;
}

async function sendCommand(mac, name) {
  const args = {};
  if (name === "feed") {
    const inp = document.getElementById("portions-" + mac);
    args.portions = parseInt(inp?.value || "1", 10);
  }
  try {
    const res = await fetch("/api/command", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mac, command: name, args }),
    });
    const data = await res.json();
    toast(res.ok ? `Sent ${name}${name === "feed" ? " ×" + args.portions : ""}` : "Error: " + (data.error || res.status));
  } catch (e) { toast("Request failed"); }
}

function updateLogEmpty() {
  const hint = logEl.querySelector(".log-empty");
  const hasRows = logEl.querySelector(".row");
  if (!hasRows && !hint) {
    const el = document.createElement("div");
    el.className = "empty log-empty";
    el.textContent = "Waiting for traffic from an unrecognised device… (known devices are hidden)";
    logEl.appendChild(el);
  } else if (hasRows && hint) {
    hint.remove();
  }
}

function addLogRow(p, ts) {
  const row = document.createElement("div");
  row.className = "row";
  const dir = p.direction === "in" ? "◀ dev" : "srv ▶";
  const cmd = CMD_NAMES[p.command] || hex(p.command, 4);
  row.innerHTML =
    `<span class="t">${fmtTime(ts)}</span>` +
    `<span class="arrow ${p.direction}">${dir}</span>` +
    `<span class="cmd">${cmd}</span>` +
    `<span class="body">${p.body || ""}</span>`;
  logEl.prepend(row);
  while (logEl.childElementCount > 300) logEl.lastElementChild.remove();
  updateLogEmpty();
}

function applySnapshot(snap) {
  devices.clear();
  for (const d of snap.devices || []) devices.set(d.mac, d);
  renderDevices();
  logEl.innerHTML = "";
  for (const e of (snap.log || [])) addLogRow(e.data, e.ts);
  updateLogEmpty();
}

function handleEvent(ev) {
  switch (ev.kind) {
    case "snapshot": applySnapshot(ev.data); break;
    case "packet": addLogRow(ev.data, ev.ts); break;
    case "device_connected":
    case "device_identified":
    case "device_state":
      devices.set(ev.data.mac, ev.data); renderDevices(); break;
    case "device_disconnected":
      devices.delete(ev.data.mac); renderDevices(); break;
  }
}

function connect() {
  const es = new EventSource("/api/events");
  es.onopen = () => { dot.classList.add("live"); conn.textContent = "live"; };
  es.onmessage = (m) => { try { handleEvent(JSON.parse(m.data)); } catch (e) {} };
  es.onerror = () => { dot.classList.remove("live"); conn.textContent = "reconnecting…"; };
}
connect();
</script>
</body>
</html>
