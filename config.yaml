# Home Assistant add-on manifest.
# Installed via the Add-on Store after adding this repo as a custom repository
# (Settings -> Add-ons -> Add-on Store -> ⋮ -> Repositories).
name: CATLINK Local
version: "0.3.3"
slug: catlink_local
description: >-
  Local DNS redirect + cloud proxy for CATLINK devices, exposed to Home
  Assistant over MQTT. The vendor app keeps working; HA gets live sensors
  (food in bowl, feeding) and a feed button.
url: https://github.com/JanisHuser/catlink-local/tree/main/catlink_local
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
  - i386
init: false
startup: application
boot: auto
# host networking so the DNS server can own port 53, the device can reach the
# add-on directly, and we see the real per-device source IPs (per-IP capture).
host_network: true
services:
  - mqtt:want
map:
  - share:rw
options:
  mode: proxy
  # One entry per device type / port. Format: "LISTEN:UPSTREAM_HOST:UPSTREAM_PORT".
  # UPSTREAM_HOST may be an IP or a hostname (resolved via `resolver`, bypassing
  # the DNS redirect). The feeder uses 8992, the scooper uses 9992.
  endpoints:
    - "8992:47.90.202.93:8992"
    - "9992:47.90.202.93:9992"
  resolver: "1.1.1.1"
  dns_port: 53
  dns_upstream: "1.1.1.1"
  catlink_domains:
    - catlinks.cn
  redirect_ip: ""
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_pass: ""
schema:
  mode: list(proxy|local)
  endpoints:
    - str
  resolver: str
  dns_port: port
  dns_upstream: str
  catlink_domains:
    - str
  redirect_ip: str?
  mqtt_host: str?
  mqtt_port: port
  mqtt_user: str?
  mqtt_pass: password?
